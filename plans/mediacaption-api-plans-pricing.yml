api_billing:
  model: >-
    POST /v1/transcripts freezes 1 credit while the request runs and charges 1
    credit on success. Bulk jobs freeze 1 credit per item at acceptance;
    successful items are charged and failed items release unused frozen
    credits. Local uploads reserve credits from estimated duration, then
    charge or refund the difference after server-side measurement.
  insufficient_credits: 402 insufficient_credits is returned before processing starts
