        user:
          $ref: "#/components/schemas/ApiUser"
    BalanceResponse:
      type: object
      additionalProperties: false
      required:
        - balance
      properties:
        balance:
          $ref: "#/components/schemas/CreditBalance"
    ApiUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - hasActiveSubscription
        - createdAt
      properties:
        id:
          type: string
          description: Media Caption user ID for the authenticated account.
          example: user_123
        email:
          type: string
          format: email
          description: Primary account email address.
          example: user@example.com
        hasActiveSubscription:
          type: boolean
          description: Whether the account currently has an active subscription.
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp.
    CreditBalance:
      type: object
      additionalProperties: false
      required:
        - credits
        - subscriptionCredits
        - bundleCredits
        - monthlyCreditLimit
        - monthlyCreditsRenewAt
      properties:
        credits:
          type: integer
          description: Total spendable credits across subscription and bundle pools.
          example: 20
        subscriptionCredits:
          type: integer
          description: Credits from the active subscription grant.
          example: 12
        bundleCredits:
          type: integer
          description: Purchased or granted credits that do not expire through subscription renewal.
          example: 8
        monthlyCreditLimit:
          type:
            - integer
            - "null"
          description: Included monthly subscription credits, or null when no active subscription limit is available.
          example: 100
        monthlyCreditsRenewAt:
          type:
            - string
            - "null"
          format: date-time
          description: Subscription credit renewal timestamp, or null when renewal details are unavailable.
          example: "2026-06-11T10:00:00.000Z"
    TranscriptRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: YouTube video URL. Required when videoId is omitted.
        videoId:
          type: string
          description: YouTube video ID. Required when url is omitted.
          example: dQw4w9WgXcQ
        language:
          $ref: "#/components/schemas/LanguageTag"
      anyOf:
        - required:
            - url
        - required:
            - videoId
    BulkTranscriptRequest:
      type: object
      additionalProperties: false
      required:
        - webhookId
        - items
      properties:
        webhookId:
          type: string
          description: "**Required** active dashboard webhook ID for one final job-level event."
          example: wh_01jz7m8a3yk9pnx2g6bc8n4a8m
        items:
          type: array
          description: "**Required** array of public transcript requests."
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkTranscriptItemRequest"
    BulkTranscriptItemRequest:
      type: object
      additionalProperties: false
      properties:
        externalId:
          type: string
          description: Customer-provided item ID returned in job results and webhooks.
        url:
          type: string
          format: uri
        videoId:
          type: string
        language:
          $ref: "#/components/schemas/LanguageTag"
      anyOf:
        - required:
            - url
        - required:
            - videoId
    LanguageTag:
      type: string
      pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
